<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Team · FPL Hub</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="bestteam.css">
  <script src="config.js"></script>
  <script defer src="bestteam.js"></script>
</head>
<body class="tool-body">
  <header class="site-header">
    <a class="brand" href="dash.html">FPL Hub</a>
    <nav class="nav-links">
      <a href="dash.html">Squad</a>
      <a href="stats.html">Stats</a>
      <a href="pvsp.html">PvP</a>
      <a href="tvst.html">TvT</a>
      <a href="bestplayer.html">Best Player</a>
      <a href="bestteam.html" class="active">Best Team</a>
    </nav>
    <details class="user-menu">
      <summary>Account</summary>
      <div class="menu">
        <a href="http://localhost/fpl_hub/backend/logout.php">Logout</a>
      </div>
    </details>
  </header>

  <main class="page tool-main">
    <div class="section-head rise">
      <div>
        <p class="eyebrow">Schedule edge</p>
        <h2>Best Team</h2>
        <p>Sort clubs by upcoming fixture difficulty and strength.</p>
      </div>
    </div>

    <div class="panel rise rise-delay-1">
      <div class="filter-bar">
        <div class="filter-group">
          <label for="sort-by">Sort by</label>
          <select id="sort-by">
            <option value="fdr">FDR</option>
            <option value="strength">Strength</option>
            <option value="strength_home">Home Strength</option>
            <option value="strength_away">Away Strength</option>
            <option value="strength_home_att">Home Attack</option>
            <option value="strength_away_att">Away Attack</option>
            <option value="strength_home_def">Home Defense</option>
            <option value="strength_away_def">Away Defense</option>
            <option value="pyfy">PYFY</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="next-games">Next games</label>
          <select id="next-games">
            <option value="1">1 Game</option>
            <option value="2">2 Games</option>
            <option value="3">3 Games</option>
            <option value="4">4 Games</option>
            <option value="5">5 Games</option>
            <option value="6">6 Games</option>
            <option value="7">7 Games</option>
            <option value="8">8 Games</option>
            <option value="9">9 Games</option>
            <option value="10">10 Games</option>
          </select>
        </div>
      </div>

      <div class="table-shell">
        <table class="data-table" id="bestteam-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Rating</th>
              <th>Next Fixtures</th>
            </tr>
          </thead>
          <tbody id="teams-container"></tbody>
        </table>
        <div id="loading" class="loading">Loading teams…</div>
      </div>
    </div>
  </main>
</body>
</html>
