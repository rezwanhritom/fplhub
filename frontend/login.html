<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FPL HUB</title>
    <link rel="stylesheet" href="http://localhost/fpl_hub/frontend/login.css">
    <script src="http://localhost/fpl_hub/frontend/login.js" defer></script>
</head>
<body>
    <div class="login-container">
        <h2>Login to FPL HUB</h2>
        <form id="login-form" method="POST" action="http://localhost/fpl_hub/login.php">
            <div class="form-group">
                <input type="text" id="username" name="username" placeholder="username" required>
                <p id="username-error" class="error"></p>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="password" required>
                <p id="password-error" class="error"></p>
            </div>
            <button type="submit" class="login-btn" disabled>Login</button>
            <div class="signup-link">
                <p>Don't have an account? <a href="http://localhost/fpl_hub/frontend/signup.html">Sign Up</a></p>
            </div>
        </form>
        <button class="google-btn" onclick="window.location='http://localhost/fpl_hub/google_login.php'">Continue with Google</button>
    </div>
</body>
</html>
