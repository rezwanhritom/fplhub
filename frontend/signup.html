<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up · FPL Hub</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="auth.css">
  <script src="config.js"></script>
  <script defer src="signup.js"></script>
</head>
<body class="auth-body">
  <header class="site-header">
    <a class="brand" href="homepage.html">FPL Hub</a>
  </header>
  <main class="auth-wrap">
    <section class="auth-panel rise">
      <p class="eyebrow">Create account</p>
      <h1>Join FPL Hub</h1>
      <p class="muted auth-sub">Your fantasy team name and picks stay in the hub database.</p>
      <form id="signup-form" action="http://localhost/fpl_hub/backend/signup.php" method="POST">
        <div class="field">
          <label for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname" required>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
          <span id="usernameError" class="error"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
          <div id="passwordStrength" class="pw-meter">
            <progress id="password-strength-bar" max="100" value="0"></progress>
            <div id="passwordCriteria" class="muted"></div>
          </div>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
          <span id="passwordError" class="error"></span>
        </div>
        <div class="field">
          <label for="fantasy_team">Fantasy team name</label>
          <input type="text" id="fantasy_team" name="fantasy_team" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary auth-submit" disabled>Sign Up</button>
      </form>
      <p class="auth-switch muted">Already a user? <a href="login.html">Log in</a></p>
      <button type="button" class="btn btn-ghost auth-google" id="google-signup">Continue with Google</button>
    </section>
  </main>
</body>
</html>
