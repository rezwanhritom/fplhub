<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · FPL Hub</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dash.css">
  <script src="config.js"></script>
  <script defer src="dash.js"></script>
</head>
<body class="dash-body">
  <header class="site-header">
    <a class="brand" href="dash.html">FPL Hub</a>
    <nav class="nav-links">
      <a href="dash.html" class="active">Squad</a>
      <a href="stats.html">Stats</a>
      <a href="pvsp.html">Player vs Player</a>
      <a href="tvst.html">Team vs Team</a>
      <a href="bestplayer.html">Best Player</a>
      <a href="bestteam.html">Best Team</a>
    </nav>
    <details class="user-menu">
      <summary>Account</summary>
      <div class="menu">
        <a href="http://localhost/fpl_hub/backend/logout.php">Logout</a>
      </div>
    </details>
  </header>

  <main class="page dash-main">
    <div class="team-header rise">
      <div>
        <p class="eyebrow">Your fantasy side</p>
        <h1 id="team-name">Loading…</h1>
      </div>
      <div class="value-chip" id="team-value">Team value £0.0m</div>
    </div>

    <div class="pitch rise rise-delay-1" id="pitch">
      <div class="row gk-row">
        <div class="player-container"><div class="player-slot gk" data-position="GKP"><div class="player-info hidden"><div class="jersey">GK</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot gk" data-position="GKP"><div class="player-info hidden"><div class="jersey">GK</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
      </div>
      <div class="row def-row">
        <div class="player-container"><div class="player-slot def" data-position="DEF"><div class="player-info hidden"><div class="jersey">DEF</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot def" data-position="DEF"><div class="player-info hidden"><div class="jersey">DEF</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot def" data-position="DEF"><div class="player-info hidden"><div class="jersey">DEF</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot def" data-position="DEF"><div class="player-info hidden"><div class="jersey">DEF</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot def" data-position="DEF"><div class="player-info hidden"><div class="jersey">DEF</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
      </div>
      <div class="row mid-row">
        <div class="player-container"><div class="player-slot mid" data-position="MID"><div class="player-info hidden"><div class="jersey">MID</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot mid" data-position="MID"><div class="player-info hidden"><div class="jersey">MID</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot mid" data-position="MID"><div class="player-info hidden"><div class="jersey">MID</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot mid" data-position="MID"><div class="player-info hidden"><div class="jersey">MID</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot mid" data-position="MID"><div class="player-info hidden"><div class="jersey">MID</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
      </div>
      <div class="row fwd-row">
        <div class="player-container"><div class="player-slot fwd" data-position="FOR"><div class="player-info hidden"><div class="jersey">FWD</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot fwd" data-position="FOR"><div class="player-info hidden"><div class="jersey">FWD</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
        <div class="player-container"><div class="player-slot fwd" data-position="FOR"><div class="player-info hidden"><div class="jersey">FWD</div><div class="player-details"><div class="player-name"></div><div class="player-stats"></div></div></div></div><button class="remove-player hidden" type="button">Remove</button></div>
      </div>
    </div>

    <div class="dash-actions">
      <button id="save-team" class="btn btn-primary hidden" type="button">Save changes</button>
      <p class="muted tip">Tap an empty slot to pick from live player data in your database.</p>
    </div>
  </main>
</body>
</html>
