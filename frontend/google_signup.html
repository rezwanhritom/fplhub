<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Sign Up</title>
    <link rel="stylesheet" href="google_signup.css">
    <script src="google_signup.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Complete Your Sign Up</h2>
        <form id="signupForm" action="http://localhost/fpl_hub/google_signup.php" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <span id="usernameError" class="error-message"></span>

            <label for="fantasy_team">Fantasy Team Name:</label>
            <input type="text" id="fantasy_team" name="fantasy_team" required>

            <button type="submit" id="submitBtn" disabled>Continue to Home</button>
        </form>
    </div>
</body>
</html>
